<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#1c2541" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="accentBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6" />
    </linearGradient>

    <!-- Filter Effects -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shieldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.2" />
    </pattern>

    <!-- Animation Keyframes Style -->
    <style>
      .pulse-orb {
        animation: pulseOrb 6s ease-in-out infinite alternate;
      }
      .pulse-orb-2 {
        animation: pulseOrb2 8s ease-in-out infinite alternate;
      }
      .stream-path {
        stroke-dasharray: 8 16;
        animation: streamFlow 4s linear infinite;
      }
      .stream-path-rev {
        stroke-dasharray: 8 16;
        animation: streamFlowRev 5s linear infinite;
      }
      .badge-float {
        animation: badgeFloat 4s ease-in-out infinite alternate;
      }
      .badge-float-2 {
        animation: badgeFloat2 5s ease-in-out infinite alternate;
      }
      .status-dot {
        animation: dotBlink 2s ease-in-out infinite;
      }
      @keyframes pulseOrb {
        0% { transform: scale(1) translate(0, 0); opacity: 0.4; }
        100% { transform: scale(1.2) translate(-20px, 15px); opacity: 0.8; }
      }
      @keyframes pulseOrb2 {
        0% { transform: scale(1) translate(0, 0); opacity: 0.3; }
        100% { transform: scale(1.25) translate(25px, -20px); opacity: 0.7; }
      }
      @keyframes streamFlow {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -120; }
      }
      @keyframes streamFlowRev {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 120; }
      }
      @keyframes badgeFloat {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-6px); }
      }
      @keyframes badgeFloat2 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(6px); }
      }
      @keyframes dotBlink {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Canvas Outer Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Animated Glowing Atmospheric Orbs (Background layer) -->
  <g class="pulse-orb" transform-origin="200 120">
    <circle cx="200" cy="120" r="140" fill="url(#glowGrad1)" />
  </g>
  <g class="pulse-orb-2" transform-origin="1000 280">
    <circle cx="1000" cy="280" r="160" fill="url(#glowGrad2)" />
  </g>

  <!-- Ambient Dynamic Data Streams (Behind text) -->
  <g opacity="0.45">
    <path class="stream-path" d="M -50,90 Q 300,160 600,70 T 1250,110" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="stream-path-rev" d="M -50,330 Q 350,260 700,340 T 1250,300" fill="none" stroke="#a855f7" stroke-width="2" />
    <path class="stream-path" d="M 100,430 C 300,350 450,220 600,220 C 750,220 900,100 1150,-10" fill="none" stroke="#4ade80" stroke-width="1.5" stroke-opacity="0.3" />
  </g>

  <!-- Foreground Central Brand & Shield Icon Container -->
  <g transform="translate(600, 72)">
    <!-- Central Hexagonal Cyber Shield -->
    <polygon points="0,-36 32,-18 32,18 0,36 -32,18 -32,-18" fill="#1e293b" stroke="url(#titleGrad)" stroke-width="2.5" filter="url(#shieldGlow)" />
    <!-- Inner Lock & Checkmark Symbol -->
    <path d="M -10,-4 L -10,-12 C -10,-18 -6,-22 0,-22 C 6,-22 10,-18 10,-12 L 10,-4 M -13,-4 L 13,-4 L 13,14 L -13,14 Z" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linejoin="round" />
    <circle cx="0" cy="5" r="2.5" fill="#38bdf8" />
  </g>

  <!-- Primary Foreground Titles (Crystal Clear & Prominent) -->
  <text x="600" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="34" letter-spacing="-0.5" fill="url(#titleGrad)" filter="url(#softGlow)">
    Awesome Centralized Data Protection
  </text>
  <text x="600" y="202" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="22" letter-spacing="1.5" fill="#e2e8f0">
    MANAGEMENT CONSOLE ECOSYSTEM
  </text>

  <!-- Subtitle Tagline -->
  <text x="600" y="238" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="15" fill="#94a3b8">
    Unified Backup Orchestration • Cyber Resilience • Disaster Recovery • Multi-Cloud Governance
  </text>

  <!-- Decorative Separator Line -->
  <line x1="380" y1="262" x2="820" y2="262" stroke="url(#accentBorder)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Dynamic Feature Badges / Metric Capsules (Bottom Row) -->
  <g transform="translate(100, 290)">
    <!-- Pill 1: Enterprise SaaS -->
    <g class="badge-float" transform="translate(20, 0)">
      <rect width="210" height="52" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" />
      <circle cx="28" cy="26" r="6" fill="#38bdf8" class="status-dot" />
      <text x="46" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="0.5">ENTERPRISE SAAS</text>
      <text x="46" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">Rubrik • Veeam • Cohesity</text>
    </g>

    <!-- Pill 2: Open Source -->
    <g class="badge-float-2" transform="translate(260, 0)">
      <rect width="220" height="52" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.4" />
      <circle cx="28" cy="26" r="6" fill="#818cf8" class="status-dot" />
      <text x="46" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#818cf8" letter-spacing="0.5">OPEN-SOURCE CONSOLES</text>
      <text x="46" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">Rclone • Restic • Backrest</text>
    </g>

    <!-- Pill 3: Cloud Native -->
    <g class="badge-float" transform="translate(510, 0)">
      <rect width="220" height="52" rx="12" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.4" />
      <circle cx="28" cy="26" r="6" fill="#c084fc" class="status-dot" />
      <text x="46" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#c084fc" letter-spacing="0.5">CLOUD &amp; KUBERNETES</text>
      <text x="46" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">Velero • Kanister • Proxmox</text>
    </g>

    <!-- Pill 4: Zero Trust Resilience -->
    <g class="badge-float-2" transform="translate(760, 0)">
      <rect width="210" height="52" rx="12" fill="url(#cardGrad)" stroke="#4ade80" stroke-width="1.2" stroke-opacity="0.4" />
      <circle cx="28" cy="26" r="6" fill="#4ade80" class="status-dot" />
      <text x="46" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#4ade80" letter-spacing="0.5">CYBER RESILIENCE</text>
      <text x="46" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">Immutable &amp; Air-Gapped</text>
    </g>
  </g>

  <!-- Elegant Outer Border -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="url(#accentBorder)" stroke-width="1.2" stroke-opacity="0.4" />
</svg>
